name: Deploy Grand Grains Admin

on:
  push:
    branches:
      - main
    paths:
      - "GrandGrainsAdmin/**"
      - ".github/workflows/deploy-grandgrains-admin.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "grand-grains-admin-pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload admin site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./GrandGrainsAdmin"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
